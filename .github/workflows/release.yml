name: GửiWeb - phát hành gói OpenWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.1.1)
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: write

concurrency:
  group: guiweb-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GUIWEB_RELEASE_TAG: ${{ inputs.tag }}
      GUIWEB_BUILD_VERSION: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate version and select writable toolchain workspace
        run: |
          [[ "$GUIWEB_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          GUIWEB_EXISTING_TAG=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$GUIWEB_RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$GUIWEB_RELEASE_TAG\") | .object.sha")
          if [[ -n "$GUIWEB_EXISTING_TAG" ]]; then
            printf 'Tag %s already exists; choose a new version.\n' "$GUIWEB_RELEASE_TAG" >&2
            exit 1
          fi
          printf 'GUIWEB_WORKSPACE=%s/guiweb\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install verified Go SDK and pinned dependencies
        run: ./scripts/install-dev.sh
      - name: Test and vet release source
        run: |
          export PATH="$GUIWEB_WORKSPACE/toolchains/go/bin:$PATH"
          export GOCACHE="$GUIWEB_WORKSPACE/.cache/guiweb-go"
          export GOPATH="$GUIWEB_WORKSPACE/.cache/guiweb-gopath"
          export GOTOOLCHAIN=local
          go test -race -mod=readonly ./...
          go vet ./...
      - name: Build native and router binaries
        run: ./scripts/build.sh
      - name: Publish package and SHA-256 checksum
        run: |
          (cd bin && sha256sum guiweb-openwrt-arm64.tar.gz > guiweb-openwrt-arm64.tar.gz.sha256)
          cp .github/RELEASE_NOTES.md "$RUNNER_TEMP/guiweb-release-notes.md"
          printf '\n[Kiểm tra và build bản phát hành](%s/%s/actions/runs/%s).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/guiweb-release-notes.md"
          gh release create "$GUIWEB_RELEASE_TAG" \
            bin/guiweb-openwrt-arm64.tar.gz \
            bin/guiweb-openwrt-arm64.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "GửiWeb $GUIWEB_RELEASE_TAG — OpenWrt ARM64" \
            --notes-file "$RUNNER_TEMP/guiweb-release-notes.md"
